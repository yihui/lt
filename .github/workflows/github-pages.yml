# Build the package site:
#   - main          -> deploy to the gh-pages branch
#   - pull requests -> preview at lt-pr-<N>.surge.sh, with the URL commented
#     on the PR
#
# Preview teardown lives in surge-teardown.yml: it runs on the `delete` event so
# it survives deleting the branch at merge time (which cancels close-event runs).
#
# One-time setup: run `surge token` on a machine where you ran `surge login` and
# add the result as repo secret SURGE_TOKEN (Settings -> Secrets and variables ->
# Actions). The deploy step is skipped until it exists. Preview URLs are public.
name: Build and deploy package site

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

# One run per ref; a new push supersedes the previous one.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

env:
  SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
      pull-requests: write # comment the preview URL
    steps:
      - uses: actions/checkout@HEAD

      - uses: r-lib/actions/setup-r@HEAD
        with:
          use-public-rspm: true
      - uses: yihui/actions/setup-r-dependencies@HEAD
        with:
          extra-packages: litedown xfun .
          r-universe: yihui
      - uses: yihui/actions/litedown-site@HEAD
        with:
          site-dir: 'site'

      # Fork PRs cannot read SURGE_TOKEN, so the two steps below are skipped for
      # them: the build still verifies the site, but there is no live preview.
      - name: Deploy PR preview to surge
        if: env.SURGE_TOKEN != '' && github.event_name == 'pull_request'
        run: |
          npm install -g surge
          surge ./site "lt-pr-${{ github.event.pull_request.number }}.surge.sh"

      - name: Comment preview URL
        if: env.SURGE_TOKEN != '' && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: surge-preview
          message: |
            🚀 Site preview: https://lt-pr-${{ github.event.pull_request.number }}.surge.sh

            Updates on every push; removed when this PR closes.

      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request'
        run: |
          tmp=$(mktemp -d)
          cp -r site/. "$tmp"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin gh-pages; then
            git switch gh-pages
          else
            git switch --orphan gh-pages
            git rm -rf . 2>/dev/null || true
          fi
          find . -maxdepth 1 ! -name .git ! -name . -exec rm -rf {} +
          cp -r "$tmp"/. .
          git add -A
          git diff --cached --quiet || (git commit -m "deploy site" && git push origin gh-pages)
