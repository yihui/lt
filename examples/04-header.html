<p><code>lt_header()</code> puts a title, and optionally a subtitle, above the table.</p>
<pre><code class="language-r">library(lt)
lt(head(iris)) |&gt;
  lt_header(&quot;Iris Measurements&quot;, &quot;First six observations&quot;)
</code></pre>
